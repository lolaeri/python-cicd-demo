name: CI/CD Pipeline

# --- Triggers -----------------------------------------------------------
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch to save minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: python-cicd-demo
  REGISTRY_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/python-cicd-demo

jobs:
  # ------------------------------------------------------------------ #
  # CI stage 1: static analysis                                        #
  # ------------------------------------------------------------------ #
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run flake8
        run: flake8 app.py tests/ --max-line-length=100

  # ------------------------------------------------------------------ #
  # CI stage 2: unit tests (matrix across Python versions)              #
  # ------------------------------------------------------------------ #
  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report -m

  # ------------------------------------------------------------------ #
  # CI stage 3: build & smoke-test the Docker image                    #
  # (build only; nothing is pushed yet)                                 #
  # ------------------------------------------------------------------ #
  build:
    name: Build Docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t $IMAGE_NAME:${{ github.sha }} .

      - name: Smoke test the container
        run: |
          docker run -d -p 5000:5000 --name smoke $IMAGE_NAME:${{ github.sha }}
          sleep 3
          curl --fail http://localhost:5000/health
          docker stop smoke

      - name: Save image as artifact
        run: docker save $IMAGE_NAME:${{ github.sha }} -o image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 5

  # ------------------------------------------------------------------ #
  # CD stage 1: push the image to Docker Hub                           #
  # Only runs for pushes to main (i.e. after a PR is merged)            #
  # ------------------------------------------------------------------ #
  push-image:
    name: Push image to registry
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load image
        run: docker load -i image.tar

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push
        run: |
          docker tag $IMAGE_NAME:${{ github.sha }} $IMAGE_NAME:latest
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest

  # ------------------------------------------------------------------ #
  # CD stage 2: deploy                                                  #
  # Uses a GitHub Environment so the deployment shows up in the         #
  # repo's "Environments" tab and can require manual approval.          #
  # ------------------------------------------------------------------ #
  deploy:
    name: Deploy to production
    needs: push-image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Trigger deployment
        id: deploy
        run: |
          # Replace this with the real deploy step for your host, e.g.:
          #   curl -X POST "$RENDER_DEPLOY_HOOK"
          #   ssh user@server 'docker pull ... && docker compose up -d'
          echo "Deploying $IMAGE_NAME:${{ github.sha }} ..."
          echo "url=https://example.com" >> "$GITHUB_OUTPUT"
